<html>
    <head>
        <meta charset="utf-8">
        <title> Cadastro de pessoa </title>
        <link rel="icon" type="image/png" href="../favicon.png">
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <link href="css/estilo.css" rel="stylesheet" type="text/css" media="screen" />
        <link href="css/form.css" rel="stylesheet" type="text/css" media="screen"/>
        <script src="html/Menu.js"></script>
    </head>
    <body>
        <div id="menu" class="menu">                  
        </div>               
        <form enctype="multipart/form-data" method="post" action="index.php?class=PessoaForm&method=save">
            <h3>Cadastrar Pessoa</h3>
            <hr>
            <label for="id"> Código </label>
            <input name="id" readonly="1" type="text" style="width:100%" value="{id}">
            
            <label for="nome"> Nome </label>
            <input name="nome" type="text" style="width:100%" required value="{nome}">
            
            <label for="endereco"> Endereço </label>
            <input name="endereco" type="text" style="width:100%" value="{endereco}">
            
            <label for="bairro"> Bairro </label>
            <input name="bairro" type="text" style="width:100%" value="{bairro}">
            
            <label for="telefone"> Telefone </label>
            <input name="telefone" type="text" style="Width:100%" value="{telefone}">
            
            <label for="email"> Email </label>
            <input name="email" type="text" style="width:100%" value="{email}">
            
            <label for="id_cidade"> Cidade </label>
            <select name="id_cidade" style="width:100%">
                {cidades}
            </select>
            
            <input type="submit" value="Salvar"><input type="reset" value="Limpar"> 
        </form>    
        <form enctype="multipart/form-data" method="post" action="index.php?class=PessoaForm">   
            <input type="submit" value="Novo">          
        </form>
        <form enctype="multipart/form-data" method="post" action="index.php?class=PessoaForm">   
            <input type="submit" value="Relatório">          
            <input name="id" readonly="1" type="hidden" style="width:100%" value="{id}">
        </form>
        <form enctype="multipart/form-data" method="post" action="index.php?class=PessoaList">   
            <input type="submit" value="Registros">          
        </form>    
        <br>        
    </body>
</html>
