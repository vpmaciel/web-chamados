<html>
    <head>
        <meta charset="utf-8">
        <title> Cadastro de pessoa </title>
        <link href="css/form.css" rel="stylesheet" type="text/css" media="screen"/>
        <script src="html/Menu.js"></script>
    </head>
    <body>
        <div id="menu" class="menu"></div>
        <form enctype="multipart/form-data" method="post" action="index.php?class=PessoaForm&method=save">
            <h3>Cadastrar Pessoa</h3>
            <hr>
            <label> Código </label>
            <input name="id" readonly="1" type="text" style="width:100%" value="{id}">
            
            <label> Nome </label>
            <input name="nome" type="text" style="width:100%" value="{nome}">
            
            <label> Endereço </label>
            <input name="endereco" type="text" style="width:100%" value="{endereco}">
            
            <label> Bairro </label>
            <input name="bairro" type="text" style="width:100%" value="{bairro}">
            
            <label> Telefone </label>
            <input name="telefone" type="text" style="Width:100%" value="{telefone}">
            
            <label> Email </label>
            <input name="email" type="text" style="width:100%" value="{email}">
            
            <label> Cidade </label>
            <select name="id_cidade" style="width:100%">
                {cidades}
            </select>
            
            <input type="submit" value="Salvar">            
        </form>    
        
        <form enctype="multipart/form-data" method="post" action="index.php?class=PessoaForm">   
            <input type="submit" value="Novo">           
        </form>    

        <form enctype="multipart/form-data" method="post" action="index.php?class=HomeForm">   
            <input type="submit" value="Home">           
        </form>    

    </body>
</html>
